<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>LinkedIn Connect</title>
<style>
:root{--bg:#0E0D10;--card:#17161A;--line:#2A292E;--tx:#FAFAFA;--mut:#9A99A0;--red:#E21D20}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Geist,system-ui,-apple-system,sans-serif;line-height:1.5}
.w{max-width:560px;margin:0 auto;padding:40px 16px}
h1{font-size:22px;margin:0 0 8px}p{color:var(--mut)}
.code{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--red);border-radius:10px;padding:14px;font-family:ui-monospace,monospace;font-size:13px;word-break:break-all;margin:16px 0}
button{background:var(--red);color:#fff;border:0;border-radius:8px;padding:10px 16px;font-size:15px;cursor:pointer}
</style></head><body><div class="w">
<h1 id="h">LinkedIn connect</h1>
<p id="p">Copy the code below and paste it to Claude. It works once and expires in about 30 minutes.</p>
<div class="code" id="c"></div>
<button id="b">Copy code</button>
</div>
<script>
const q = new URLSearchParams(location.search), code = q.get("code"), err = q.get("error");
const c = document.getElementById("c"), b = document.getElementById("b");
if (err) {
  document.getElementById("h").textContent = "LinkedIn returned an error";
  document.getElementById("p").textContent = "Paste this to Claude so it can fix the app settings.";
  c.textContent = err + ": " + (q.get("error_description") || "");
} else if (code) {
  c.textContent = location.href;
} else {
  c.textContent = "No code in this link.";
  b.style.display = "none";
}
b.onclick = () => { navigator.clipboard.writeText(c.textContent).then(() => b.textContent = "Copied"); };
history.replaceState(null, "", location.pathname);
</script>
</body></html>
